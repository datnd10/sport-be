spring.application.name=sport-be

# ===== Datasource (PostgreSQL) =====
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/lananhsport}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

# ===== JWT =====
jwt.secret=${JWT_SECRET:change-me-dev-only-secret-key-please-override-in-prod-env}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===== Product image uploads =====
app.upload.root-dir=${UPLOAD_ROOT_DIR:uploads}
app.upload.products-dir=${UPLOAD_PRODUCTS_DIR:uploads/products}
app.upload.max-image-size-bytes=${UPLOAD_MAX_IMAGE_SIZE_BYTES:5242880}
spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:25MB}

# ===== Shop bank transfer info (Chuyển_Khoản_Ngân_Hàng) =====
shop.bank.bank-name=${SHOP_BANK_NAME:Vietcombank}
shop.bank.account-number=${SHOP_BANK_ACCOUNT_NUMBER:0123456789}
shop.bank.account-holder=${SHOP_BANK_ACCOUNT_HOLDER:CONG TY LANANHSPORT}
shop.bank.qr-image-url=${SHOP_BANK_QR_IMAGE_URL:/static/bank-qr.png}

# ===== CORS (frontend origin allowlist) =====
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
