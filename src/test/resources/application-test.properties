spring.application.name=sport-be-test

# ===== Datasource (H2 in-memory for tests) =====
spring.datasource.url=jdbc:h2:mem:sport_be_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ===== JWT =====
jwt.secret=test-only-secret-key-not-for-production-use-0123456789
jwt.expiration-ms=3600000
